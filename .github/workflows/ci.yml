# Checks every pull request: the version agrees everywhere, the frontend typechecks and
# builds, the backend's tests pass with no warnings, and Windows keeps compiling.
#
# Only the parts a pull request touches run: a frontend-only change skips the Rust jobs
# and the other way round. "CI result" sums them up and is the one check to require.
#
# rust-cache.yml calls this workflow on main (warm-cache) so the Rust caches the
# backend jobs save there can be restored by the next pull request. A pull request's
# own cache is only visible to that pull request, so pull requests never save one.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      warm-cache:
        description: Run only the Rust jobs, to save their caches on main.
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10
  # Smaller, faster CI builds: incremental state is never reused here, and line tables
  # are enough for a backtrace.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  # "No new warnings": any warning fails the build.
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changes and version
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A file counts for the frontend unless it is backend, docs, prose or CI
          # configuration. A change to this workflow runs everything.
          predicate-quantifier: every
          filters: |
            frontend:
              - '**'
              - '!src-tauri/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/**'
            backend:
              - '{src-tauri/**,.github/workflows/ci.yml}'
            ci:
              - '.github/workflows/ci.yml'

      # Plain Node, no install: cheap enough to run on every pull request.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Every copy of the version agrees
        run: node scripts/version.ts --check

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && !inputs.warm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall runs `nuxt prepare`, which writes the tsconfig the typecheck uses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm vue-tsc --noEmit -p .nuxt/tsconfig.app.json

      - name: Build
        run: pnpm build

  backend-linux:
    name: Backend (Linux)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # Restores the installed packages from the cache instead of apt-get update + install.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf xdg-utils
          version: tauri-1
          execute_install_scripts: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: rui314/setup-mold@v1

      # The tests never run the voice model (that test is #[ignore]d), so the candle
      # crates need not be optimised here: it halves their cold build.
      - name: CI cargo profile
        working-directory: .
        run: |
          mkdir -p ~/.cargo
          for p in candle-core candle-nn candle-transformers gemm gemm-common gemm-f32 half; do
            printf '[profile.dev.package.%s]\nopt-level = 0\n' "$p"
          done >> ~/.cargo/config.toml

      # Its own key: debug test builds, nothing the release cache holds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri reads build.frontendDist at compile time. The backend does not need the real
      # frontend for tests, only the folder.
      - name: Placeholder frontend
        working-directory: .
        run: mkdir -p .output/public

      # `cargo test` also compiles the library as the app uses it (the binary links it),
      # so warnings outside test code still fail here; a separate `cargo build` would only
      # add a link of the app binary.
      - name: Test
        run: cargo test --locked

  # Windows type-checks on its own runner: `check` covers the cfg(windows) code and the
  # tests without linking, which is most of a build's time. (Cross-checking from Linux
  # with cargo-xwin downloads the MSVC CRT from Microsoft on every cold cache, and that
  # download can hang on GitHub's runners.) It does not run anything on Windows.
  backend-windows:
    name: Backend (Windows check)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Placeholder frontend
        working-directory: .
        shell: bash
        run: mkdir -p .output/public

      - name: Check
        run: cargo check --locked --all-targets

  result:
    name: CI result
    needs: [changes, frontend, backend-linux, backend-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
