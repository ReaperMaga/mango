# Checks every pull request: the frontend typechecks and builds, the backend builds
# without warnings and its tests pass, and Windows keeps compiling.
#
# Pushes to main run it too, so the Rust cache it saves there can be restored by the
# next pull request (a pull request's cache is only visible to that pull request).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall runs `nuxt prepare`, which writes the tsconfig the typecheck uses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every copy of the version agrees
        run: pnpm version:check

      - name: Typecheck
        run: pnpm vue-tsc --noEmit -p .nuxt/tsconfig.app.json

      - name: Build
        run: pnpm build

  backend:
    name: Backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full test suite runs on Linux.
          - name: Linux
            os: ubuntu-22.04
            test: true
          # Windows builds the app and compiles the tests. Running them waits on the git
          # tests learning Windows paths (they compare against `\\?\C:\...` there).
          - name: Windows
            os: windows-latest
            test: false
    runs-on: ${{ matrix.os }}
    env:
      # "No new warnings": any warning fails the build.
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      # Its own key: these are debug builds with -D warnings, nothing the release cache holds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri reads build.frontendDist at compile time. The backend does not need the real
      # frontend for a debug build or tests, only the folder.
      - name: Placeholder frontend
        working-directory: .
        shell: bash
        run: mkdir -p .output/public

      - name: Build
        run: cargo build --locked

      - name: Test
        if: matrix.test
        run: cargo test --locked

      - name: Compile tests
        if: ${{ !matrix.test }}
        run: cargo test --locked --no-run
