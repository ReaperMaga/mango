# Builds the Windows, macOS and Linux installers and publishes them as a GitHub release.
#
#   Tag push vX.Y.Z  ->  draft release, build every platform, upload installers, publish.
#   Manual run       ->  build every platform and keep the installers as workflow
#                        artifacts only (no release). Use it to try a build before tagging.
#
# The tag must match package.json (`pnpm bump X.Y.Z` sets every copy of the version).
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD if the key has
# one): the in-app updater only installs bundles signed with it. The macOS app is signed and
# notarized with the APPLE_* secrets (see docs/development/releasing.md); the notarizing is
# done by scripts/release-macos.sh, which gives Apple a deadline.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Every copy of the version agrees
        run: node scripts/version.ts --check

      - name: The updater signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (see docs/development/releasing.md)."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Run 'pnpm bump $version' or retag."
            exit 1
          fi

      # One draft release up front, so the platform builds upload to the same release
      # instead of racing to create it. It is published once every build has succeeded.
      - name: Create the draft release
        id: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          # A re-run reuses the release it made before. The list includes drafts (a lookup
          # by tag does not).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [ -z "$id" ]; then
            # Take the id from the create response: a new draft can take a while to show
            # up in the list, and an empty id makes every build skip its uploads.
            notes=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body)
            intro="Installers for Windows, macOS and Linux are attached below. Install notes: https://reapermaga.github.io/mango/guide/install"
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Mango $VERSION" \
              -f body="$(printf '%s\n\n%s' "$intro" "$notes")" \
              -F draft=true -F prerelease="$prerelease" \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not create or find the release for $GITHUB_REF_NAME."
            exit 1
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04
          # Both Macs build on the Apple Silicon runner; Intel is cross-compiled there.
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Builds take minutes; macOS adds up to 40 for notarization. Nothing should sit for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restores the compiled dependencies that rust-cache.yml saves on main. A run for a
      # tag can read caches from main but not from other tags, so saving here would only
      # fill the cache quota with entries no later release can use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          # The two macOS builds share a runner type, so the target tells their caches apart.
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Developer ID signing, and notarization with an App Store Connect API key. Only the
      # secrets that are set are exported: Tauri treats an empty variable as set and would fail.
      # The API key goes out as NOTARY_*, not APPLE_API_*: Tauri would notarize itself on seeing
      # those and wait on Apple with no time limit. scripts/release-macos.sh notarizes instead.
      - name: Apple signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            value="${!name}"
            [ -n "$value" ] || continue
            { echo "$name<<APPLE_EOF"; echo "$value"; echo "APPLE_EOF"; } >> "$GITHUB_ENV"
          done
          [ -z "$APPLE_API_KEY" ] || echo "NOTARY_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          [ -z "$APPLE_API_ISSUER" ] || echo "NOTARY_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
            echo "NOTARY_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret: the macOS app is not signed."
          elif [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::APPLE_API_KEY, APPLE_API_ISSUER or APPLE_API_KEY_P8 missing: the macOS app is signed but not notarized."
          fi

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the installers for the in-app updater (public key in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # On macOS the script runs `pnpm tauri build` (signs the app and DMG), then
          # notarizes and staples the DMG with a deadline instead of waiting on Apple forever.
          tauriScript: ${{ runner.os == 'macOS' && 'bash scripts/release-macos.sh' || 'pnpm tauri' }}
          # Updater bundles + .sig files are made only here, so local builds need no key.
          args: --config src-tauri/tauri.updater.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          releaseId: ${{ needs.prepare.outputs.release-id }}
          # latest.json: what the in-app updater reads from the latest release.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # A retry rebuilds and resubmits: no help when Apple's queue is slow, and the
          # script already retries its own network calls. ('0' as a string: a bare 0 is falsy.)
          retryAttempts: ${{ runner.os == 'macOS' && '0' || '1' }}
          # Manual runs have no release: keep the installers on the run instead.
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          workflowArtifactNamePattern: '[name]_[version]_[platform]_[arch]_[bundle]'

  publish:
    name: Publish release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
            *)   gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
