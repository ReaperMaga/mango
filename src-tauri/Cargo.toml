[package]
name = "mango"
version = "0.2.0"
description = "Mango, a desktop agent workbench"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mango_lib"
# Desktop only: the staticlib and cdylib in the Tauri template are for mobile, and on
# desktop they only make cargo link the whole app two extra times per build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: child webviews (`Window::add_child`) for the browser; devtools: its inspector in release builds too.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# Desktop notifications: a chat finished, or needs you (`notify.rs`).
tauri-plugin-notification = "2"
# mango:// share links: a second instance hands its link to the running one.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
similar = "2"
# Voice input: Whisper in pure Rust (no C++ toolchain), its download, and the audio hand-off.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# Share links: Ed25519 keys (already in the tree through rustls).
ring = "0.17"
base64 = "0.23"
# Chat history: SQLite compiled in (no system library to find on Windows or macOS).
rusqlite = { version = "0.37", features = ["bundled"] }
# Language servers that leave watching to their client hear of files changed on disk (lsp/watch.rs).
notify = "8"

# Deleting in the Files view goes to the Recycle Bin through our own shell calls: the trash crate
# deletes for good what does not fit the bin (trash_bin.rs). Language servers run in a job object,
# so their whole process tree ends with them and with Mango (lsp/tree.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
# The `implement` macro's output names it.
windows-core = "0.62"

# The trash on macOS and Linux.
[target.'cfg(not(windows))'.dependencies]
trash = { version = "5.4", default-features = false, features = ["freedesktop"] }

# Signals and waitid for a language server's process group (lsp/tree.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser on Linux: Tauri packs child webviews into the window's GTK box, so browser.rs moves
# them into an overlay above Mango's own webview, and takes screenshots through WebKitGTK.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

# Whisper is unusably slow unoptimised; keep debug builds of the app fast to iterate on
# while its math runs at release speed.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
