[package]
name = "mango"
version = "0.1.9"
description = "Mango, a desktop agent workbench"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mango_lib"
# Desktop only: the staticlib and cdylib in the Tauri template are for mobile, and on
# desktop they only make cargo link the whole app two extra times per build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# mango:// share links: a second instance hands its link to the running one.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
similar = "2"
# Voice input: Whisper in pure Rust (no C++ toolchain), its download, and the audio hand-off.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# Share links: Ed25519 keys (already in the tree through rustls).
ring = "0.17"
base64 = "0.23"

# Whisper is unusably slow unoptimised; keep debug builds of the app fast to iterate on
# while its math runs at release speed.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
